  <circle cx="400" cy="250" r="120" fill="#581c87" fill-opacity="0.3" />
  <text x="400" y="240" fill="#fdf4ff" font-family="sans-serif" font-size="24" font-weight="800" text-anchor="middle">STORY SCENE • ACT 4</text>
