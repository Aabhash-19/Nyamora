<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 850" width="600" height="850">
  <defs>
    <linearGradient id="bg-nym-141" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091e3a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0b0b12" />
    </linearGradient>
    <radialGradient id="glow-nym-141" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#091e3a" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow-nym-141" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="black" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Full Background -->
  <rect width="600" height="850" fill="url(#bg-nym-141)" />
  <circle cx="300" cy="380" r="240" fill="url(#glow-nym-141)" />

  <!-- Manga Frame Lines -->
  <rect x="25" y="25" width="550" height="800" rx="12" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.5" />
  <rect x="35" y="35" width="530" height="780" rx="8" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />

  <!-- Top Badges / Convention -->
  <rect x="45" y="55" width="120" height="28" rx="8" fill="#111119" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1" />
  <text x="105" y="74" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1">Comiket 101</text>

  <rect x="435" y="55" width="120" height="28" rx="8" fill="#e11d48" fill-opacity="0.85" />
  <text x="495" y="74" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="2">ADULT 18+</text>

  <!-- Central Character Silhouette / Artwork Emblem -->
  <g transform="translate(300, 360)">
    <circle r="140" fill="#0b0b14" fill-opacity="0.6" stroke="#60a5fa" stroke-width="2" stroke-dasharray="8 6" />
    <circle r="120" fill="none" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Seductive Nyamora Cat Motif Centerpiece -->
    <path d="M -50,-40 C -70,-80 -30,-120 0,-140 C 30,-120 70,-80 50,-40 C 90,0 70,60 0,90 C -70,60 -90,0 -50,-40 Z" fill="#60a5fa" fill-opacity="0.25" stroke="#60a5fa" stroke-width="2" filter="url(#shadow-nym-141)" />
    <path d="M -30,-60 L -50,-110 L -10,-85 Z M 30,-60 L 50,-110 L 10,-85 Z" fill="#60a5fa" />
    <!-- Stylized Heart & Rose Emblem -->
    <circle cx="0" cy="10" r="32" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2" />
    <path d="M -12,8 C -22,-6 0,-18 0,4 C 0,-18 22,-6 12,8 L 0,22 Z" fill="#60a5fa" />
    <text x="0" y="70" fill="#eff6ff" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="3">Distance</text>
  </g>

  <!-- Title Plate Banner -->
  <g transform="translate(50, 520)">
    <rect width="500" height="200" rx="16" fill="#0b0b14" fill-opacity="0.9" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow-nym-141)" />
    
    <!-- Japanese Title -->
    <text x="250" y="45" fill="#60a5fa" font-family="sans-serif" font-size="16" font-weight="800" text-anchor="middle" letter-spacing="2">秘術年代記 第41巻 ～Distance特選集～</text>
    
    <!-- English Canonical Title (Multi-line safe) -->
    <text x="250" y="85" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">The Arcane Chronicles Vol. 41: D...</text>
    
    <!-- Line separator -->
    <line x1="80" y1="110" x2="420" y2="110" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    
    <!-- Author & Circle Attribution -->
    <text x="250" y="140" fill="#eff6ff" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">Circle: Distance [Artist: Distance]</text>
    <text x="250" y="170" fill="#94a3b8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">NYAMORA VERIFIED ADULT DOUJIN ARCHIVE</text>
  </g>

  <!-- Tags Bar -->
  
    <rect x="50" y="740" width="100" height="26" rx="6" fill="#13131c" fill-opacity="0.8" stroke="#60a5fa" stroke-width="1" />
    <text x="100" y="757" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#romance</text>
  
    <rect x="160" y="740" width="100" height="26" rx="6" fill="#13131c" fill-opacity="0.8" stroke="#60a5fa" stroke-width="1" />
    <text x="210" y="757" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#office romance</text>
  
    <rect x="270" y="740" width="100" height="26" rx="6" fill="#13131c" fill-opacity="0.8" stroke="#60a5fa" stroke-width="1" />
    <text x="320" y="757" fill="#60a5fa" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">#elf</text>
  

  <!-- Footer ID -->
  <text x="300" y="805" fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">OFFICIAL LICENSED METADATA • ID: #NYM-141</text>
</svg>